services:
  db:
    image: mysql:8.0
    container_name: norte-eventos-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${DB_NAME:-norte_eventos}
      MYSQL_USER: ${MYSQL_APP_USER:-norte_user}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-norte123}
    ports:
      - "${DB_EXTERNAL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: norte-eventos-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-norte_eventos}
      DB_USER: ${MYSQL_APP_USER:-norte_user}
      DB_PASSWORD: ${MYSQL_APP_PASSWORD:-norte123}
      JWT_SECRET: ${JWT_SECRET:-chave_jwt_padrao_para_desenvolvimento_docker_minimo_32_chars}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - ./frontend/uploads:/app/frontend/uploads

volumes:
  mysql_data:
