<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Norte Eventos</title>
</head>
<body>
    <h2>Criar Conta</h2>
    <form id="formCadastro">
        <input type="text" id="nome" placeholder="Nome completo" required><br><br>
        <input type="email" id="email" placeholder="E-mail" required><br><br>
        <input type="password" id="senha" placeholder="Senha" required><br><br>
        <button type="submit">Cadastrar</button>
    </form>
    <p>Já tem uma conta? <a href="/login">Faça o login aqui</a></p>

    <script src="../js/cadastroUser.js"></script>
</body>
</html>
