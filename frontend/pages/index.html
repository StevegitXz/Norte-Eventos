<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Norte Eventos — Início</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="../css/tailwind.css">
</head>

<body class="bg-brand-light font-sans text-brand-dark antialiased">

    <main class="min-h-screen flex flex-col items-center justify-center relative overflow-hidden px-4 py-12">

        <!-- Luz atmosférica sutil -->
        <div class="absolute inset-0 z-0 pointer-events-none" aria-hidden="true">
            <div class="absolute -top-36 -right-36 w-[480px] h-[480px] bg-brand-emerald/15 rounded-full blur-3xl"></div>
            <div class="absolute -bottom-36 -left-36 w-[480px] h-[480px] bg-brand-amber/10 rounded-full blur-3xl"></div>
        </div>

        <div class="relative z-10 text-center max-w-3xl bg-white/80 backdrop-blur-md border border-stone-200/80 rounded-3xl p-8 sm:p-14 shadow-[0_8px_32px_rgba(0,0,0,0.04)]">
            <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-brand-green/10 text-brand-green text-xs font-bold uppercase tracking-wider mb-6">
                Região Norte • Experiências
            </div>

            <h1 class="text-4xl sm:text-5xl md:text-6xl font-display font-extrabold tracking-tight text-brand-dark mb-5 leading-[1.08]">
                Bem-vindo ao <span class="text-brand-green">Norte Eventos</span>
            </h1>

            <p class="text-base sm:text-lg text-stone-600 mb-9 max-w-xl mx-auto leading-relaxed">
                A plataforma editorial completa para você descobrir, gerenciar e vivenciar os melhores eventos da região amazônica.
            </p>

            <div class="flex flex-col sm:flex-row items-center justify-center gap-3.5">
                <a href="/login" class="btn-primary w-full sm:w-auto rounded-full px-8 py-3.5 text-base">
                    Acessar minha conta
                </a>
                <a href="/cadastro" class="btn-secondary w-full sm:w-auto rounded-full px-8 py-3.5 text-base">
                    Criar nova conta
                </a>
            </div>
        </div>
    </main>

</body>

</html>
