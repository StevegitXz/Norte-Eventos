<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <title>Login - Norte Eventos</title>
</head>
<body>
    <h2>Acessar Conta</h2>

    <p>Ainda não tem uma conta? <a href="/cadastro">Cadastre-se aqui</a></p>

    <script src="../js/loginUser.js"></script>
</body>
</html>
