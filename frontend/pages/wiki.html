<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wiki — Norte Eventos | Central de Documentação</title>
  <meta name="description" content="Central de documentação oficial do Norte Eventos para participantes, organizadores e desenvolvedores." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/tailwind.css" />
  <script>
    (function () {
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="bg-brand-light dark:bg-[#0B110E] text-brand-dark dark:text-gray-100 font-sans antialiased transition-colors duration-200">

  <!-- Skip link de acessibilidade -->
  <a href="#wiki-conteudo" class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-50 focus:bg-brand-dark focus:text-white focus:px-4 focus:py-2 focus:rounded-xl focus:shadow-lg focus:outline-none">
    Pular para o conteúdo da documentação
  </a>

  <!-- HEADER SUPERIOR FIXO -->
  <header class="sticky top-0 z-40 h-16 bg-[#F7F7F4]/90 dark:bg-[#0B110E]/90 backdrop-blur-md border-b border-stone-200/80 dark:border-white/10">
    <div class="max-w-[1440px] mx-auto h-full px-4 sm:px-6 flex items-center justify-between gap-3">
      <!-- Esquerda: Menu mobile + Logo Wiki -->
      <div class="flex items-center gap-3 min-w-0">
        <button type="button" id="btn-mobile-menu" class="lg:hidden p-2 -ml-1 rounded-xl text-stone-600 dark:text-gray-300 hover:bg-stone-200/60 dark:hover:bg-white/10 transition-colors cursor-pointer" aria-label="Abrir menu da Wiki" aria-expanded="false">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>

        <a href="/wiki" id="wiki-brand-link" class="flex items-center gap-2.5 group shrink-0">
          <img src="/assets/icons/Logo-fd-preto.png" alt="Logotipo Norte Eventos" class="h-8 w-auto block dark:hidden transition-transform group-hover:scale-105" />
          <img src="/assets/icons/Logo.png" alt="Logotipo Norte Eventos" class="h-8 w-auto hidden dark:block brightness-0 invert transition-transform group-hover:scale-105" />
          <div class="flex items-center gap-2">
            <span class="font-display font-bold text-base sm:text-lg tracking-tight text-brand-dark dark:text-white leading-none">
              Norte <span class="text-brand-green dark:text-brand-emerald">Eventos</span>
            </span>
            <span class="px-2 py-0.5 rounded-full bg-brand-green/10 dark:bg-brand-emerald/15 text-brand-green dark:text-brand-emerald border border-brand-green/20 dark:border-brand-emerald/25 font-display font-bold text-[11px] uppercase tracking-wider">
              Wiki
            </span>
          </div>
        </a>
      </div>

      <!-- Centro: Busca Global Instantânea -->
      <div class="relative flex-1 max-w-md mx-2">
        <div class="relative flex items-center">
          <span class="absolute left-3.5 text-stone-400 pointer-events-none" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </span>
          <input
            type="search"
            id="wiki-search-input"
            placeholder="Buscar na documentação..."
            autocomplete="off"
            aria-label="Buscar na documentação"
            class="w-full pl-10 pr-16 py-2 rounded-full bg-white dark:bg-[#121A16] border border-stone-200/90 dark:border-white/10 text-sm text-brand-dark dark:text-gray-100 placeholder:text-stone-400 dark:placeholder:text-gray-500 focus:border-brand-green dark:focus:border-brand-emerald focus:ring-3 focus:ring-brand-green/15 outline-none transition-all shadow-2xs"
          />
          <kbd class="hidden sm:inline-flex items-center px-2 py-0.5 rounded-md bg-stone-100 dark:bg-white/10 border border-stone-200 dark:border-white/10 text-[11px] font-semibold text-stone-500 dark:text-gray-400 absolute right-3 pointer-events-none">
            Ctrl K
          </kbd>
        </div>

        <!-- Dropdown de resultados da busca -->
        <div id="wiki-search-results" class="hidden absolute left-0 right-0 top-[calc(100%+8px)] bg-white dark:bg-[#121A16] border border-stone-200 dark:border-white/15 rounded-2xl shadow-xl overflow-hidden z-50 max-h-[65vh] overflow-y-auto custom-scrollbar" role="listbox" aria-label="Resultados da busca"></div>
      </div>

      <!-- Direita: Tema + Links para o Sistema -->
      <div class="flex items-center gap-2 shrink-0">
        <button type="button" id="btn-wiki-theme" class="p-2 rounded-full bg-white dark:bg-[#121A16] border border-stone-200/80 dark:border-white/10 text-stone-600 dark:text-gray-300 hover:text-brand-green dark:hover:text-brand-emerald transition-colors cursor-pointer" aria-label="Alternar tema claro ou escuro" title="Alternar tema">
          <svg id="wiki-icon-sun" class="hidden dark:block" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          <svg id="wiki-icon-moon" class="block dark:hidden" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>

        <a href="/" class="hidden md:inline-flex items-center px-3.5 py-2 rounded-full text-xs sm:text-sm font-semibold text-stone-600 dark:text-gray-300 hover:bg-stone-200/60 dark:hover:bg-white/10 transition-colors">
          Site
        </a>
        <a href="/dashboard" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-brand-green hover:bg-brand-green-light text-white text-xs sm:text-sm font-semibold shadow-xs transition-all">
          <span>Abrir Sistema</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </a>
      </div>
    </div>
  </header>

  <!-- OVERLAY MOBILE DA SIDEBAR -->
  <div id="wiki-mobile-backdrop" class="hidden fixed inset-0 bg-black/50 backdrop-blur-xs z-40 lg:hidden"></div>

  <!-- LAYOUT 3 COLUNAS ESTILO WIKI IFAC -->
  <div class="max-w-[1440px] mx-auto flex min-h-[calc(100vh-4rem)]">

    <!-- COLUNA 1: SIDEBAR DE NAVEGAÇÃO EM ÁRVORE -->
    <aside id="wiki-sidebar" class="fixed lg:sticky top-16 left-0 z-50 lg:z-10 w-72 h-[calc(100vh-4rem)] bg-white/95 dark:bg-[#111915]/95 lg:bg-transparent lg:dark:bg-transparent border-r border-stone-200/80 dark:border-white/10 transform -translate-x-full lg:translate-x-0 transition-transform duration-200 flex flex-col shrink-0" aria-label="Menu da documentação">
      <!-- Filtro rápido por perfil -->
      <div class="p-4 border-b border-stone-200/70 dark:border-white/10">
        <p class="text-[11px] font-bold uppercase tracking-wider text-stone-400 dark:text-gray-500 mb-2">
          Filtrar por perfil
        </p>
        <div id="wiki-audience-filters" class="flex flex-wrap gap-1.5">
          <button type="button" data-audience="all" class="audience-pill px-2.5 py-1 rounded-full text-xs font-semibold bg-brand-green text-white transition-colors cursor-pointer">Todos</button>
          <button type="button" data-audience="usuario" class="audience-pill px-2.5 py-1 rounded-full text-xs font-semibold bg-stone-200/70 dark:bg-white/10 text-stone-600 dark:text-gray-300 hover:bg-stone-200 dark:hover:bg-white/15 transition-colors cursor-pointer">Usuário</button>
          <button type="button" data-audience="organizador" class="audience-pill px-2.5 py-1 rounded-full text-xs font-semibold bg-stone-200/70 dark:bg-white/10 text-stone-600 dark:text-gray-300 hover:bg-stone-200 dark:hover:bg-white/15 transition-colors cursor-pointer">Organizador</button>
          <button type="button" data-audience="dev" class="audience-pill px-2.5 py-1 rounded-full text-xs font-semibold bg-stone-200/70 dark:bg-white/10 text-stone-600 dark:text-gray-300 hover:bg-stone-200 dark:hover:bg-white/15 transition-colors cursor-pointer">Dev</button>
        </div>
      </div>

      <!-- Árvore de categorias e artigos -->
      <nav id="wiki-nav-tree" class="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-5" aria-label="Navegação por capítulos">
        <div class="space-y-3 animate-pulse">
          <div class="h-3 w-24 bg-stone-200 dark:bg-white/10 rounded"></div>
          <div class="h-8 w-full bg-stone-200/70 dark:bg-white/5 rounded-xl"></div>
          <div class="h-8 w-5/6 bg-stone-200/70 dark:bg-white/5 rounded-xl"></div>
        </div>
      </nav>

      <!-- Rodapé da Sidebar -->
      <div class="p-4 border-t border-stone-200/70 dark:border-white/10 text-xs text-stone-500 dark:text-gray-400 flex items-center justify-between">
        <span>Norte Eventos Docs</span>
        <span id="wiki-version-badge" class="px-2 py-0.5 rounded-md bg-stone-200/70 dark:bg-white/10 font-mono text-[11px]">v1.0.0</span>
      </div>
    </aside>

    <!-- COLUNA 2: CONTEÚDO PRINCIPAL DO ARTIGO -->
    <main id="wiki-conteudo" class="flex-1 min-w-0 px-5 sm:px-8 lg:px-12 py-8 sm:py-10">
      <div class="max-w-3xl mx-auto">
        <!-- Breadcrumbs + Badge de Público -->
        <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
          <nav id="wiki-breadcrumbs" class="flex items-center gap-1.5 text-xs font-medium text-stone-500 dark:text-gray-400" aria-label="Breadcrumb">
            <span>Wiki</span>
          </nav>
          <span id="wiki-audience-badge" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold uppercase tracking-wider bg-brand-green/10 dark:bg-brand-emerald/15 text-brand-green dark:text-brand-emerald">
            Todos
          </span>
        </div>

        <!-- Corpo do Artigo -->
        <article id="wiki-article" class="wiki-prose bg-white dark:bg-[#111915] border border-stone-200/80 dark:border-white/10 rounded-3xl p-6 sm:p-10 shadow-[0_2px_16px_rgba(0,0,0,0.03)]">
          <div class="space-y-4 animate-pulse">
            <div class="h-9 w-2/3 bg-stone-200 dark:bg-white/10 rounded-xl"></div>
            <div class="h-4 w-full bg-stone-200/70 dark:bg-white/5 rounded"></div>
            <div class="h-4 w-5/6 bg-stone-200/70 dark:bg-white/5 rounded"></div>
            <div class="h-4 w-4/6 bg-stone-200/70 dark:bg-white/5 rounded"></div>
          </div>
        </article>

        <!-- Metadados de atualização -->
        <div class="mt-4 px-2 flex flex-wrap items-center justify-between gap-2 text-xs text-stone-400 dark:text-gray-500">
          <span id="wiki-updated-at">Documentação oficial do projeto Norte Eventos</span>
          <a href="/wiki/faq" data-wiki-slug="faq" class="hover:text-brand-green dark:hover:text-brand-emerald transition-colors font-medium">
            Dúvidas? Consulte o FAQ →
          </a>
        </div>

        <!-- Navegação Anterior / Próxima Página -->
        <nav id="wiki-prev-next" class="mt-8 grid grid-cols-1 sm:grid-cols-2 gap-4" aria-label="Navegação entre páginas"></nav>
      </div>
    </main>

    <!-- COLUNA 3: SUMÁRIO DA PÁGINA ATUAL (NESTA PÁGINA) -->
    <aside class="hidden xl:block w-64 shrink-0 sticky top-16 h-[calc(100vh-4rem)] overflow-y-auto custom-scrollbar py-10 pr-6 pl-2" aria-label="Sumário desta página">
      <div class="border-l border-stone-200/80 dark:border-white/10 pl-4">
        <p class="text-[11px] font-bold uppercase tracking-wider text-stone-400 dark:text-gray-500 mb-3">
          Nesta página
        </p>
        <ul id="wiki-toc" class="space-y-2 text-xs text-stone-500 dark:text-gray-400">
          <li>Carregando seções...</li>
        </ul>
      </div>
    </aside>

  </div>

  <!-- Mermaid opcional para renderizar fluxogramas e DER (fallback automático caso offline) -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js" defer></script>
  <script type="module" src="/js/wiki.js"></script>
</body>
</html>
